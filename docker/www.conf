[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Static process pool sized for Render's smaller instance tiers. Bump
; pm.max_children if you move to a plan with more RAM (roughly RAM_MB / 40).
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Send worker errors to stdout/stderr instead of a log file, matching the
; app's LOG_CHANNEL=stderr for one consolidated log stream on Render.
catch_workers_output = yes
decorate_workers_output = no
