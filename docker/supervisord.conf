[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; Without this, the tasks defined in routes/console.php (weekly audit-log
; cleanup, daily audit chain verification, daily DB backup) are defined but
; never actually triggered — Laravel's scheduler only runs when something
; calls it. `schedule:work` is the container-friendly equivalent of a cron
; entry running `php artisan schedule:run` every minute, kept alive here by
; supervisord the same way php-fpm and nginx are.
command=php artisan schedule:work
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
